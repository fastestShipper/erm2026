# ERM 2026 · datos abiertos (peruvian.dev/dataonpe)
location = /dataonpe { return 301 /dataonpe/; }
location ^~ /dataonpe/api/ {
    limit_req zone=erm_api burst=10 nodelay;
    client_max_body_size 16m;
    client_body_timeout 60s;
    proxy_pass http://127.0.0.1:8833;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
}
location ^~ /dataonpe/data/ {
    alias /srv/erm2026/data/;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    charset utf-8;
    charset_types text/csv application/json;
    gzip on; gzip_types application/json text/csv; gzip_min_length 1024;
    autoindex on;
}
location ^~ /dataonpe/ {
    alias /srv/erm2026/web/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on; gzip_types text/css application/javascript application/json; gzip_min_length 1024;
}
