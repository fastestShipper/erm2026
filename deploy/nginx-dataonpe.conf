# ERM 2026 · peruvian.dev/dataonpe (se incluye dentro del server { } de peruvian.dev)
#
# Regla de oro: lo que la propia página pide nunca debe responder 400/403/404, porque CrowdSec
# (http-probing) banea la IP y, detrás de CGNAT, eso deja fuera a miles de personas.

location = /dataonpe { return 301 /dataonpe/; }

# Contador de personas viendo: solo POST, sin cuerpo y sin disco
location = /dataonpe/api/ping {
    if ($request_method != POST) { return 405; }
    limit_req zone=erm_ping burst=400 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;      # un exceso detrás de CGNAT no debe llegar a CrowdSec como ataque
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8833;
    proxy_read_timeout 5s;
    include /etc/nginx/snippets/erm2026-headers.conf;
    add_header Cache-Control "no-store" always;
}
# Compatibilidad con pestañas abiertas de versiones anteriores
location = /dataonpe/api/stats {
    default_type application/json;
    include /etc/nginx/snippets/erm2026-headers.conf;
    add_header Cache-Control "no-store" always;
    return 200 '{"recibidos":0,"enRevision":0,"verificados":0}';
}
# El formulario de evidencias se retiró el 2026-10-04
location ^~ /dataonpe/api/ {
    default_type application/json;
    return 410 '{"error":"El formulario de evidencias ya no está disponible."}';
}

# Datos públicos. Un archivo que todavía no existe responde {} con 200 (ver la regla de oro).
location ^~ /dataonpe/data/actas/mesas/ {
    alias /srv/erm2026-mesas/;
    error_page 404 = @erm2026_vacio;
    include /etc/nginx/snippets/erm2026-headers.conf;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;
    gzip on; gzip_types application/json; gzip_min_length 1024;
}
location ^~ /dataonpe/data/ {
    alias /srv/erm2026/data/;
    error_page 404 = @erm2026_vacio;
    include /etc/nginx/snippets/erm2026-headers.conf;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;
    charset utf-8;
    charset_types text/csv application/json;
    gzip on; gzip_types application/json text/csv; gzip_min_length 1024;
    autoindex on;                    # datos abiertos: cualquiera puede recorrer la carpeta
}
location @erm2026_vacio {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 '{}';
}

# Sitio estático
location ^~ /dataonpe/assets/ {
    alias /srv/erm2026/web/assets/;
    include /etc/nginx/snippets/erm2026-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip on; gzip_types text/css application/javascript; gzip_min_length 1024;
}
location ^~ /dataonpe/ {
    alias /srv/erm2026/web/;
    index index.html;
    include /etc/nginx/snippets/erm2026-headers.conf;
    add_header Cache-Control "no-cache" always;
    gzip on; gzip_types text/css application/javascript application/json; gzip_min_length 1024;
}
